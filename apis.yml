name: YoloRekt
description: 'YOLOrekt is a social, hyper-gamified DeFi prediction-markets dApp where users
  bid on the short-term future price of crypto assets such as ETH, BTC, and MATIC, or provide
  in-game liquidity to earn game fees and YOLO rewards. Built on the Polygon network for high
  transaction speed, negligible fees, and full EVM support, YOLOrekt is delivered as Ethereum
  and Polygon smart contracts (including a first-of-its-kind synced dual-token issuance across
  both chains) rather than a traditional REST/GraphQL API. Backed by Pantera Capital and surfaced
  into the API Evangelist network as a crypto portfolio company; the yolorekt.finance domain no
  longer resolves and the project appears dormant, with its surviving public surface being the
  YOLOrekt GitHub organization, community bug-bounty programs, and the YOLOrekt Medium publication.'
